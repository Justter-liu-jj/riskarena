name: ci
on: [push, pull_request]
jobs:
  redlines-and-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 红线机械检查(CHARTER)
        run: python tools/lint_redlines.py
      - name: 基线锦标赛可复现
        run: python -m riskarena tournament --trials 50
      - name: 语料真人体检(误伤率必须可得)
        run: |
          python -c "
          from riskarena.corpora import load_corpus;
          r = load_corpus('data/corpus/converted.jsonl');
          assert len(r) >= 1000, f'corpus too small: {len(r)}';
          print('corpus ok:', len(r))
          "
